<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>W12 How-To</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>

<body>

    <h2>Exercise: Glute Bridge</h2>

<button class="accordion">
  Glute Bridge
  <span class="checkmark">○</span>
</button>

<div class="panel">
  <p><strong>Purpose:</strong> Strengthen glutes and improve pelvic stability.</p>
  <p><strong>Steps:</strong></p>
  <ol>
    <li>Lie on your back with knees bent.</li>
    <li>Press through your heels and lift your hips.</li>
    <li>Hold 2–3 seconds, then lower slowly.</li>
  </ol>

  <label class="complete-container">
    <input type="checkbox" id="completeBox">
    Mark Complete
  </label>
</div>

<style>
.accordion {
  background-color: #eee;
  color: #444;
  cursor: pointer;
  padding: 18px;
  width: 100%;
  border: none;
  text-align: left;
  outline: none;
  font-size: 15px;
  transition: 0.4s;
}

.active, .accordion:hover {
  background-color: #ccc; 
}

.panel {
  padding: 0 18px;
  display: none;
  background-color: white;
  overflow: hidden;
}
</style>

  <style>
/* The container */
.container {
  display: block;
  position: relative;
  padding-left: 35px;
  margin-bottom: 12px;
  cursor: pointer;
  font-size: 22px;
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
}

/* Hide the browser's default checkbox */
.container input {
  position: absolute;
  opacity: 0;
  cursor: pointer;
  height: 0;
  width: 0;
}

/* Create a custom checkbox */
.checkmark {
  position: absolute;
  top: 0;
  left: 0;
  height: 25px;
  width: 25px;
  background-color: #eee;
}

/* On mouse-over, add a grey background color */
.container:hover input ~ .checkmark {
  background-color: #ccc;
}

/* When the checkbox is checked, add a blue background */
.container input:checked ~ .checkmark {
  background-color: #2196F3;
}

/* Create the checkmark/indicator (hidden when not checked) */
.checkmark:after {
  content: "";
  position: absolute;
  display: none;
}

/* Show the checkmark when checked */
.container input:checked ~ .checkmark:after {
  display: block;
}

/* Style the checkmark/indicator */
.container .checkmark:after {
  left: 9px;
  top: 5px;
  width: 5px;
  height: 10px;
  border: solid white;
  border-width: 0 3px 3px 0;
  -webkit-transform: rotate(45deg);
  -ms-transform: rotate(45deg);
  transform: rotate(45deg);
}
</style>
</body>

    <script>
        // Accordion open/close
        var acc = document.getElementsByClassName("accordion");

        for (let i = 0; i < acc.length; i++) {
          acc[i].addEventListener("click", function () {
            this.classList.toggle("active");
            var panel = this.nextElementSibling;
            panel.style.display = panel.style.display === "block" ? "none" : "block";
          });
        }

        // Mark Complete toggle
        const checkbox = document.getElementById("completeBox");
        const checkmark = document.querySelector(".checkmark");

        checkbox.addEventListener("change", function () {
          if (this.checked) {
            checkmark.textContent = "✓";
          } else {
            checkmark.textContent = "○";
          }
        });
    </script>

</body>
</html>
